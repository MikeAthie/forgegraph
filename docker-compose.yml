
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgegraph-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgegraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      FF_OS_SHELL: ${FF_OS_SHELL:-true}
      FF_AGENT_REGISTRY: ${FF_AGENT_REGISTRY:-true}
      FF_TASK_PROJECTIONS: ${FF_TASK_PROJECTIONS:-true}
      FF_DECISION_CENTER: ${FF_DECISION_CENTER:-true}
      FF_ACCOUNTING_AGGREGATES: ${FF_ACCOUNTING_AGGREGATES:-true}
      FF_PUBLIC_API_ALIASES: ${FF_PUBLIC_API_ALIASES:-true}
      DJANGO_SUPERUSER_CREATE: ${DJANGO_SUPERUSER_CREATE:-false}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      ENGINE_HOST: engine
      ENGINE_PORT: 50051
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:?ENGINE_CALLBACK_SECRET is required}
      RUN_LIVENESS_TIMEOUT_SECONDS: ${RUN_LIVENESS_TIMEOUT_SECONDS:-60}
      RUN_ENGINE_STALLED_TIMEOUT_SECONDS: ${RUN_ENGINE_STALLED_TIMEOUT_SECONDS:-60}
      BACKEND_WATCHDOG_ENABLED: ${BACKEND_WATCHDOG_ENABLED:-true}
      BACKEND_WATCHDOG_HEALTH_TIMEOUT_SECONDS: ${BACKEND_WATCHDOG_HEALTH_TIMEOUT_SECONDS:-5}
      BACKEND_WATCHDOG_REQUEST_TIMEOUT_MS: ${BACKEND_WATCHDOG_REQUEST_TIMEOUT_MS:-5000}
      BACKEND_WATCHDOG_REQUEST_TIMEOUTS_PER_MINUTE: ${BACKEND_WATCHDOG_REQUEST_TIMEOUTS_PER_MINUTE:-10}
      BACKEND_WATCHDOG_QUEUE_BACKLOG_THRESHOLD: ${BACKEND_WATCHDOG_QUEUE_BACKLOG_THRESHOLD:-500}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-playwright-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:12434/v1}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/oauth/callback}
      ENGINE_CALLBACK_URL: http://backend:8000/api/runs/engine-events
      CONTROL_PLANE_URL: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time $${BACKEND_WATCHDOG_HEALTH_TIMEOUT_SECONDS:-5} http://localhost:8000/health || kill -TERM 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend-runtime-intents:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-backend-runtime-intents
    restart: unless-stopped
    command:
      [
        "python",
        "manage.py",
        "process_runtime_write_intents",
        "--consumer",
        "docker-runtime-intents",
      ]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      FF_OS_SHELL: ${FF_OS_SHELL:-true}
      FF_AGENT_REGISTRY: ${FF_AGENT_REGISTRY:-true}
      FF_TASK_PROJECTIONS: ${FF_TASK_PROJECTIONS:-true}
      FF_DECISION_CENTER: ${FF_DECISION_CENTER:-true}
      FF_ACCOUNTING_AGGREGATES: ${FF_ACCOUNTING_AGGREGATES:-true}
      FF_PUBLIC_API_ALIASES: ${FF_PUBLIC_API_ALIASES:-true}
      DJANGO_SUPERUSER_CREATE: ${DJANGO_SUPERUSER_CREATE:-false}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      ENGINE_HOST: engine
      ENGINE_PORT: 50051
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:?ENGINE_CALLBACK_SECRET is required}
      RUN_LIVENESS_TIMEOUT_SECONDS: ${RUN_LIVENESS_TIMEOUT_SECONDS:-60}
      RUN_ENGINE_STALLED_TIMEOUT_SECONDS: ${RUN_ENGINE_STALLED_TIMEOUT_SECONDS:-60}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-playwright-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:12434/v1}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/oauth/callback}
      ENGINE_CALLBACK_URL: http://backend:8000/api/runs/engine-events
      CONTROL_PLANE_URL: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: forgegraph-engine
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      GRPC_PORT: 50051
      METRICS_PORT: 9090
      ENGINE_HOST: engine
      MAX_WORKERS: 10
      DEFAULT_TIMEOUT_MS: 30000
      ENGINE_LLM_MAX_CONCURRENCY: ${ENGINE_LLM_MAX_CONCURRENCY:-4}
      ENGINE_LLM_MAX_QUEUE_SIZE: ${ENGINE_LLM_MAX_QUEUE_SIZE:-32}
      ENGINE_LLM_QUEUE_TIMEOUT_MS: ${ENGINE_LLM_QUEUE_TIMEOUT_MS:-5000}
      ENGINE_LLM_REQUEST_TIMEOUT_MS: ${ENGINE_LLM_REQUEST_TIMEOUT_MS:-45000}
      ENGINE_LLM_CIRCUIT_FAILURE_RATE_THRESHOLD: ${ENGINE_LLM_CIRCUIT_FAILURE_RATE_THRESHOLD:-0.75}
      ENGINE_LLM_CIRCUIT_MIN_REQUESTS: ${ENGINE_LLM_CIRCUIT_MIN_REQUESTS:-20}
      ENGINE_LLM_CIRCUIT_WINDOW_SIZE: ${ENGINE_LLM_CIRCUIT_WINDOW_SIZE:-20}
      ENGINE_LLM_CIRCUIT_COOLDOWN_MS: ${ENGINE_LLM_CIRCUIT_COOLDOWN_MS:-15000}
      ENGINE_LLM_FALLBACK_MODE: ${ENGINE_LLM_FALLBACK_MODE:-error}
      ENGINE_LLM_FALLBACK_CONTENT: ${ENGINE_LLM_FALLBACK_CONTENT:-}
      FORGEGRAPH_LLM_CHAOS_MODE: ${FORGEGRAPH_LLM_CHAOS_MODE:-off}
      FORGEGRAPH_LLM_CHAOS_DELAY_MS: ${FORGEGRAPH_LLM_CHAOS_DELAY_MS:-0}
      FORGEGRAPH_LLM_CHAOS_ERROR_MESSAGE: ${FORGEGRAPH_LLM_CHAOS_ERROR_MESSAGE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:12434/v1}
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:?ENGINE_CALLBACK_SECRET is required}
      CONTROL_PLANE_URL: http://backend:8000
      ENGINE_RUN_STATE_MODE: ${ENGINE_RUN_STATE_MODE:-control-plane-http}
      REDIS_ADDR: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      ENGINE_RUNTIME_INTENT_STREAM: ${ENGINE_RUNTIME_INTENT_STREAM:-forgegraph:runtime:intents}
      ENGINE_RUNTIME_WRITE_MODE: ${ENGINE_RUNTIME_WRITE_MODE:-pause-intents}
      TOOL_MANIFEST_DIR: /app/tool-manifests
      MEMORY_GRPC_HOST: memory-grpc
      MEMORY_GRPC_PORT: 50052
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      memory-grpc:
        condition: service_started
    volumes:
      - ./engine/tool-manifests:/app/tool-manifests:ro

  memory-grpc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-memory-grpc
    command: ["python", "-m", "adapters.grpc.server"]
    ports:
      - "50052:50052"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DEBUG: ${DEBUG:-false}
      ENGINE_HOST: engine
      ENGINE_PORT: 50051
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend}
      MEMORY_GRPC_HOST: 0.0.0.0
      MEMORY_GRPC_PORT: 50052
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:?ENGINE_CALLBACK_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; channel = grpc.insecure_channel('127.0.0.1:50052'); stub = health_pb2_grpc.HealthStub(channel); response = stub.Check(health_pb2.HealthCheckRequest(service='memory'), timeout=0.5); raise SystemExit(0 if response.status == health_pb2.HealthCheckResponse.SERVING else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    container_name: forgegraph-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  backend_static:
