
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgegraph-postgres
    environment:
      POSTGRES_DB: forgegraph
      POSTGRES_USER: forgegraph
      POSTGRES_PASSWORD: forgegraph_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgegraph -d forgegraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgegraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: forgegraph
      DB_USER: forgegraph
      DB_PASSWORD: forgegraph_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-docker-local-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DJANGO_SUPERUSER_CREATE: ${DJANGO_SUPERUSER_CREATE:-false}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      ENGINE_HOST: engine
      ENGINE_PORT: 50051
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:-dev_shared_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-31w_1yyrCRlD_5Uyp9iofvy68W9T1ty9W81BbBlkbWI=}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/oauth/callback}
      ENGINE_CALLBACK_URL: http://backend:8000/api/runs/engine-events
      CONTROL_PLANE_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: forgegraph-engine
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: 50051
      DATABASE_URL: postgres://forgegraph:forgegraph_secret@postgres:5432/forgegraph?sslmode=disable
      MAX_WORKERS: 10
      DEFAULT_TIMEOUT_MS: 30000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENGINE_CALLBACK_SECRET: ${ENGINE_CALLBACK_SECRET:-dev_shared_secret}
      CONTROL_PLANE_URL: http://backend:8000
      TOOL_MANIFEST_DIR: /app/tool-manifests
      MEMORY_GRPC_HOST: memory-grpc
      MEMORY_GRPC_PORT: 50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      memory-grpc:
        condition: service_started
    volumes:
      - ./engine/tool-manifests:/app/tool-manifests:ro

  memory-grpc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-memory-grpc
    command: ["python", "-m", "adapters.grpc.server"]
    ports:
      - "50052:50052"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: forgegraph
      DB_USER: forgegraph
      DB_PASSWORD: forgegraph_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-docker-local-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MEMORY_GRPC_HOST: 0.0.0.0
      MEMORY_GRPC_PORT: 50052
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-31w_1yyrCRlD_5Uyp9iofvy68W9T1ty9W81BbBlkbWI=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgegraph-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  backend_static:
