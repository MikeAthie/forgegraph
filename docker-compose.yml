
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgegraph-postgres
    environment:
      POSTGRES_DB: forgegraph
      POSTGRES_USER: forgegraph
      POSTGRES_PASSWORD: forgegraph_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgegraph -d forgegraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgegraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgegraph-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: forgegraph
      DB_USER: forgegraph
      DB_PASSWORD: forgegraph_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      DJANGO_SUPERUSER_EMAIL: admin@forgegraph.local
      DJANGO_SUPERUSER_PASSWORD: admin123456
      ENGINE_HOST: engine
      ENGINE_PORT: 50051
      ENGINE_CALLBACK_URL: http://backend:8000/api/runs/{run_id}/events/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: forgegraph-engine
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: 50051
      DATABASE_URL: postgres://forgegraph:forgegraph_secret@postgres:5432/forgegraph?sslmode=disable
      MAX_WORKERS: 10
      DEFAULT_TIMEOUT_MS: 30000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgegraph-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  backend_static:
