syntax = "proto3";

package engine;

option go_package = "github.com/forgegraph/engine;main";

// EngineService provides core ForgeGraph engine operations
service EngineService {
  // Ping returns a pong response for health checking
  rpc Ping(PingRequest) returns (PingResponse);

  // StartRun begins executing a workflow graph
  rpc StartRun(StartRunRequest) returns (StartRunResponse);

  // GetRunStatus returns the current status of a run
  rpc GetRunStatus(GetRunStatusRequest) returns (GetRunStatusResponse);

  // CancelRun cancels an active run
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);

  // ResumeRun resumes a paused run (e.g., after human gate approval)
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
}

// MemoryService provides semantic memory retrieval for Tier 3.
service MemoryService {
  // RetrieveMemory returns relevant memory chunks for a query.
  rpc RetrieveMemory(RetrieveMemoryRequest) returns (RetrieveMemoryResponse);

  // SaveObservation creates or updates a curated memory observation.
  rpc SaveObservation(SaveObservationRequest) returns (SaveObservationResponse);

  // SearchObservations returns curated observations matching the query and scope.
  rpc SearchObservations(SearchObservationsRequest) returns (SearchObservationsResponse);

  // GetObservation returns a single curated observation by ID.
  rpc GetObservation(GetObservationRequest) returns (GetObservationResponse);

  // GetContext returns context-ready curated observations and retrieval strategy metadata.
  rpc GetContext(GetContextRequest) returns (GetContextResponse);

  // GetTimeline returns recent curated observations ordered by recency.
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
}

// =============================================================================
// Health Check
// =============================================================================

// PingRequest is the request message for the Ping RPC
message PingRequest {
  string message = 1;
}

// PingResponse is the response message for the Ping RPC
message PingResponse {
  string message = 1;
}

// =============================================================================
// Run Execution
// =============================================================================

// StartRunRequest initiates workflow execution
message StartRunRequest {
  // Unique identifier for this run (UUID from control plane)
  string run_id = 1;

  // The graph definition as JSON string (GraphVersion.graph_json)
  string graph_json = 2;

  // Initial input variables as JSON string
  string input_json = 3;

  // URL to POST execution events back to control plane
  string callback_url = 4;

  // Memory configuration as JSON string
  string memory_config_json = 5;

  // Tenant identifier for multi-tenant isolation
  string tenant_id = 6;

  // Session identifier for cross-run memory sharing
  string session_id = 7;
}

// StartRunResponse confirms run acceptance
message StartRunResponse {
  // Whether the run was accepted for execution
  bool accepted = 1;

  // Error message if not accepted
  string error = 2;
}

// GetRunStatusRequest queries run status
message GetRunStatusRequest {
  // The run ID to query
  string run_id = 1;
}

// GetRunStatusResponse returns current run status
message GetRunStatusResponse {
  // The run ID
  string run_id = 1;

  // Current status: pending, running, paused, succeeded, failed, canceled
  string status = 2;

  // Currently executing node ID (if running)
  string current_node_id = 3;

  // Error message (if failed)
  string error = 4;
}

// CancelRunRequest requests run cancellation
message CancelRunRequest {
  // The run ID to cancel
  string run_id = 1;
}

// CancelRunResponse confirms cancellation
message CancelRunResponse {
  // Whether cancellation was successful
  bool success = 1;

  // Error message if cancellation failed
  string error = 2;
}

// ResumeRunRequest resumes a paused run (human gate)
message ResumeRunRequest {
  // The run ID to resume
  string run_id = 1;

  // The human gate node ID to resume from
  string node_id = 2;

  // Human-provided input as JSON string
  string input_json = 3;
}

// ResumeRunResponse confirms resumption
message ResumeRunResponse {
  // Whether the run was resumed
  bool accepted = 1;

  // Error message if resumption failed
  string error = 2;
}

// =============================================================================
// Memory Retrieval
// =============================================================================

message RetrieveMemoryRequest {
  // Tenant identifier for isolation
  string tenant_id = 1;

  // Query text to embed and search
  string query = 2;

  // Optional scoping identifiers
  string agent_id = 3;
  string run_id = 4;
  string session_id = 5;

  // Retrieval parameters
  int32 top_k = 6;
  double threshold = 7;
  double recency_weight = 8;
  string embedding_model = 9;
}

message MemoryChunk {
  string content = 1;
  double score = 2;
  string source_timestamp = 3;
  string metadata_json = 4;
}

message RetrieveMemoryResponse {
  repeated MemoryChunk chunks = 1;
  string error = 2;
}

// =============================================================================
// Curated Memory Observations
// =============================================================================

message Observation {
  string id = 1;
  string tenant_id = 2;
  string graph_id = 3;
  string run_id = 4;
  string session_id = 5;
  string agent_id = 6;
  string memory_chunk_id = 7;
  string type = 8;
  string title = 9;
  string content = 10;
  string scope = 11;
  string topic_key = 12;
  string tool_name = 13;
  int32 revision_count = 14;
  int32 duplicate_count = 15;
  string last_seen_at = 16;
  string created_at = 17;
  string updated_at = 18;
  string deleted_at = 19;
  bool is_deleted = 20;
}

message SaveObservationRequest {
  string tenant_id = 1;
  string observation_id = 2;
  string graph_id = 3;
  string run_id = 4;
  string session_id = 5;
  string agent_id = 6;
  string type = 7;
  string title = 8;
  string content = 9;
  string scope = 10;
  string topic_key = 11;
  string tool_name = 12;
  optional bool dedupe = 13;
  optional bool update_topic = 14;
}

message SaveObservationResponse {
  Observation observation = 1;
  string error = 2;
}

message SearchObservationsRequest {
  string tenant_id = 1;
  string query = 2;
  string graph_id = 3;
  string run_id = 4;
  string session_id = 5;
  string agent_id = 6;
  string scope = 7;
  string type = 8;
  string topic_key = 9;
  int32 limit = 10;
  bool include_deleted = 11;
}

message SearchObservationsResponse {
  repeated Observation observations = 1;
  string error = 2;
}

message GetObservationRequest {
  string tenant_id = 1;
  string observation_id = 2;
  bool include_deleted = 3;
}

message GetObservationResponse {
  Observation observation = 1;
  string error = 2;
}

message GetContextRequest {
  string tenant_id = 1;
  string graph_id = 2;
  string run_id = 3;
  string session_id = 4;
  string agent_id = 5;
  string query = 6;
  int32 limit = 7;
}

message GetContextResponse {
  repeated Observation observations = 1;
  bool degraded = 2;
  repeated string strategies = 3;
  string error = 4;
}

message GetTimelineRequest {
  string tenant_id = 1;
  string graph_id = 2;
  string run_id = 3;
  string session_id = 4;
  string agent_id = 5;
  string scope = 6;
  int32 limit = 7;
  bool include_deleted = 8;
}

message GetTimelineResponse {
  repeated Observation observations = 1;
  string error = 2;
}
