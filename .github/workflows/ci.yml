name: Full CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgegraph
          POSTGRES_USER: forgegraph
          POSTGRES_PASSWORD: forgegraph_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forgegraph -d forgegraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # If you use uv (recommended), keep this; otherwise replace with your installer
      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend deps (dev)
        working-directory: backend
        run: python -m uv sync --dev

      - name: Backend checks
        run: bash scripts/ci/run_backend_checks.sh


  engine:
    name: engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache: true

      - name: Engine checks
        run: bash scripts/ci/run_engine_checks.sh


  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Frontend checks
        run: bash scripts/ci/run_frontend_checks.sh


  launch_qa_backend:
    name: launch-qa-backend
    needs: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgegraph
          POSTGRES_USER: forgegraph
          POSTGRES_PASSWORD: forgegraph_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forgegraph -d forgegraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend deps (dev)
        working-directory: backend
        run: python -m uv sync --dev

      - name: Launch QA - Backend Functional/Security
        run: bash scripts/ci/run_launch_qa_backend.sh


  launch_qa_engine:
    name: launch-qa-engine
    needs: engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache: true

      - name: Launch QA - Engine Reliability
        run: bash scripts/ci/run_launch_qa_engine.sh


  launch_qa_frontend:
    name: launch-qa-frontend
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Launch QA - Frontend UX
        run: bash scripts/ci/run_launch_qa_frontend.sh


  launch_qa_report:
    name: launch-qa-report
    needs: [launch_qa_backend, launch_qa_engine, launch_qa_frontend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Build launch report
        run: |
          cat > launch-qa-report.md <<EOF
          # Launch QA Gate Report

          | Suite | Result |
          | --- | --- |
          | Backend Functional + Security | ${{ needs.launch_qa_backend.result }} |
          | Engine Reliability | ${{ needs.launch_qa_engine.result }} |
          | Frontend UX | ${{ needs.launch_qa_frontend.result }} |

          Overall gate: ${{ (needs.launch_qa_backend.result == 'success' && needs.launch_qa_engine.result == 'success' && needs.launch_qa_frontend.result == 'success') && 'PASS' || 'FAIL' }}
          EOF

      - name: Upload launch QA report
        uses: actions/upload-artifact@v4
        with:
          name: launch-qa-report
          path: launch-qa-report.md


  required-checks:
    name: required-checks
    needs:
      - backend
      - engine
      - frontend
      - launch_qa_backend
      - launch_qa_engine
      - launch_qa_frontend
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI gates
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "engine=${{ needs.engine.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "launch_qa_backend=${{ needs.launch_qa_backend.result }}"
          echo "launch_qa_engine=${{ needs.launch_qa_engine.result }}"
          echo "launch_qa_frontend=${{ needs.launch_qa_frontend.result }}"

          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.engine.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_backend.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_engine.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_frontend.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi

          echo "All required CI checks passed."
