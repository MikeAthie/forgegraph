name: Full CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Governance checks
        run: bash scripts/ci/run_governance_checks.sh

  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgegraph
          POSTGRES_USER: forgegraph
          POSTGRES_PASSWORD: forgegraph_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forgegraph -d forgegraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # If you use uv (recommended), keep this; otherwise replace with your installer
      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend deps (dev)
        working-directory: backend
        run: python -m uv sync --dev

      - name: Backend checks
        run: bash scripts/ci/run_backend_checks.sh


  engine:
    name: engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Engine checks
        run: bash scripts/ci/run_engine_checks.sh

  loadgen:
    name: loadgen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Loadgen checks
        run: bash scripts/ci/run_loadgen_smoke.sh


  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Frontend checks
        run: bash scripts/ci/run_frontend_checks.sh


  backend_unit:
    name: backend-unit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgegraph
          POSTGRES_USER: forgegraph
          POSTGRES_PASSWORD: forgegraph_secret
        ports:
          - 5433:5432
        options: >-
