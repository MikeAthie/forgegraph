      REDIS_ADDR: 127.0.0.1:6379
      PLAYWRIGHT_LLM_MOCK_ERROR_MODE: "off"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install backend deps (dev)
        working-directory: backend
        run: python -m uv sync --dev
      - name: Put backend venv first
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Guard live specs against mocks
        run: bash scripts/ci/check_live_playwright_no_mocks.sh
      - name: Failure retry dead-letter live
        working-directory: frontend
        run: npx playwright test __tests__/e2e/failure-retry-dead-letter-live.spec.ts --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-retry-dead-letter-report
          path: frontend/playwright-report
          if-no-files-found: ignore


