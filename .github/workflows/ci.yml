      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Guard live specs against mocks
        run: bash scripts/ci/check_live_playwright_no_mocks.sh

      - name: Launch QA - Live backend engine websocket
        working-directory: frontend
        run: >
          npx playwright test
          __tests__/e2e/human-gate-live.spec.ts
          __tests__/e2e/production-launch-live.spec.ts
