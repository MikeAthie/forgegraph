  launch_qa_report:
    name: launch-qa-report
    needs: [launch_qa_backend, launch_qa_engine, launch_qa_frontend, launch_qa_live]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Build launch report
        run: |
          cat > launch-qa-report.md <<EOF
          # Launch QA Gate Report

          | Suite | Result |
          | --- | --- |
          | Backend Functional + Security | ${{ needs.launch_qa_backend.result }} |
          | Engine Reliability | ${{ needs.launch_qa_engine.result }} |
          | Frontend UX | ${{ needs.launch_qa_frontend.result }} |
          | Live Full Stack | ${{ needs.launch_qa_live.result }} |

          Overall gate: ${{ (needs.launch_qa_backend.result == 'success' && needs.launch_qa_engine.result == 'success' && needs.launch_qa_frontend.result == 'success' && needs.launch_qa_live.result == 'success') && 'PASS' || 'FAIL' }}
          EOF

      - name: Upload launch QA report
        uses: actions/upload-artifact@v4
        with:
          name: launch-qa-report
          path: launch-qa-report.md


  required-checks:
    name: required-checks
    needs:
      - governance
      - backend
      - engine
      - loadgen
      - frontend
      - backend_unit
      - backend_integration
      - migration
      - security_regression
      - sre_readiness
      - engine_deterministic
      - engine_integration
      - engine_race
      - frontend_unit
      - frontend_playwright_mocked
      - launch_qa_backend
      - launch_qa_engine
      - launch_qa_frontend
      - launch_qa_live
      - frontend_playwright_live
      - full_hitl_lifecycle
      - failure_retry_dead_letter
      - tenant_isolation
      - load_smoke
      - docker_full_stack_smoke
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI gates
        run: |
          echo "governance=${{ needs.governance.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "engine=${{ needs.engine.result }}"
          echo "loadgen=${{ needs.loadgen.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "backend_unit=${{ needs.backend_unit.result }}"
          echo "backend_integration=${{ needs.backend_integration.result }}"
          echo "migration=${{ needs.migration.result }}"
          echo "security_regression=${{ needs.security_regression.result }}"
          echo "sre_readiness=${{ needs.sre_readiness.result }}"
          echo "engine_deterministic=${{ needs.engine_deterministic.result }}"
          echo "engine_integration=${{ needs.engine_integration.result }}"
          echo "engine_race=${{ needs.engine_race.result }}"
          echo "frontend_unit=${{ needs.frontend_unit.result }}"
          echo "frontend_playwright_mocked=${{ needs.frontend_playwright_mocked.result }}"
          echo "launch_qa_backend=${{ needs.launch_qa_backend.result }}"
          echo "launch_qa_engine=${{ needs.launch_qa_engine.result }}"
          echo "launch_qa_frontend=${{ needs.launch_qa_frontend.result }}"
          echo "launch_qa_live=${{ needs.launch_qa_live.result }}"
          echo "frontend_playwright_live=${{ needs.frontend_playwright_live.result }}"
          echo "full_hitl_lifecycle=${{ needs.full_hitl_lifecycle.result }}"
          echo "failure_retry_dead_letter=${{ needs.failure_retry_dead_letter.result }}"
          echo "tenant_isolation=${{ needs.tenant_isolation.result }}"
          echo "load_smoke=${{ needs.load_smoke.result }}"
          echo "docker_full_stack_smoke=${{ needs.docker_full_stack_smoke.result }}"

          if [ "${{ needs.governance.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.engine.result }}" != "success" ] || \
             [ "${{ needs.loadgen.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend_unit.result }}" != "success" ] || \
             [ "${{ needs.backend_integration.result }}" != "success" ] || \
             [ "${{ needs.migration.result }}" != "success" ] || \
             [ "${{ needs.security_regression.result }}" != "success" ] || \
             [ "${{ needs.sre_readiness.result }}" != "success" ] || \
             [ "${{ needs.engine_deterministic.result }}" != "success" ] || \
             [ "${{ needs.engine_integration.result }}" != "success" ] || \
             [ "${{ needs.engine_race.result }}" != "success" ] || \
             [ "${{ needs.frontend_unit.result }}" != "success" ] || \
             [ "${{ needs.frontend_playwright_mocked.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_backend.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_engine.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_frontend.result }}" != "success" ] || \
             [ "${{ needs.launch_qa_live.result }}" != "success" ] || \
             [ "${{ needs.frontend_playwright_live.result }}" != "success" ] || \
             [ "${{ needs.full_hitl_lifecycle.result }}" != "success" ] || \
             [ "${{ needs.failure_retry_dead_letter.result }}" != "success" ] || \
             [ "${{ needs.tenant_isolation.result }}" != "success" ] || \
             [ "${{ needs.load_smoke.result }}" != "success" ] || \
             [ "${{ needs.docker_full_stack_smoke.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi

          echo "All required CI checks passed."
