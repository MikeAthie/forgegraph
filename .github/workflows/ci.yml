      PLAYWRIGHT_DEV_PORT: "3001"
      PLAYWRIGHT_BACKEND_PORT: "8002"
      PLAYWRIGHT_ENGINE_PORT: "50071"
      PLAYWRIGHT_ENGINE_METRICS_PORT: "9091"
      USE_IN_MEMORY_CHANNEL_LAYER: "false"
      USE_IN_MEMORY_CACHE: "false"
      USE_SQLITE: "false"
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: forgegraph
      DB_USER: forgegraph
      DB_PASSWORD: forgegraph_secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_ADDR: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend deps (dev)
        working-directory: backend
        run: python -m uv sync --dev

      - name: Put backend venv first
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
