name: CI

on:
  pull_request:

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend_fast:
    name: backend-fast
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgegraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: forgegraph
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SECRET_KEY: "ci-not-a-secret"
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      ALLOWED_HOSTS: "localhost"
      ENCRYPTION_KEY: "31w_1yyrCRlD_5Uyp9iofvy68W9T1ty9W81BbBlkbWI="
      SECURE_SSL_REDIRECT: "false"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend deps (dev)
        working-directory: backend
        run: uv sync --dev

      - name: Restore pytest-testmon cache
        uses: actions/cache@v4
        with:
          path: backend/.testmondata
          key: backend-testmon-${{ runner.os }}-${{ github.base_ref }}-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            backend-testmon-${{ runner.os }}-${{ github.base_ref }}-
            backend-testmon-${{ runner.os }}-

      - name: Backend fast checks
        run: bash scripts/ci/run_backend_checks_fast.sh

  engine_fast:
    name: engine-fast
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache: true

      - name: Engine fast checks
        run: bash scripts/ci/run_engine_checks_fast.sh

  frontend_fast:
    name: frontend-fast
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: frontend/.jest-cache
          key: frontend-jest-${{ runner.os }}-${{ github.base_ref }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-jest-${{ runner.os }}-${{ github.base_ref }}-
            frontend-jest-${{ runner.os }}-

      - name: Frontend fast checks
        run: bash scripts/ci/run_frontend_checks_fast.sh

  required-checks:
    name: required-checks
    needs:
      - backend_fast
      - engine_fast
      - frontend_fast
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI gates
        run: |
          echo "backend-fast=${{ needs.backend_fast.result }}"
          echo "engine-fast=${{ needs.engine_fast.result }}"
          echo "frontend-fast=${{ needs.frontend_fast.result }}"

          if [ "${{ needs.backend_fast.result }}" != "success" ] || \
             [ "${{ needs.engine_fast.result }}" != "success" ] || \
             [ "${{ needs.frontend_fast.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi

          echo "All required CI checks passed."
