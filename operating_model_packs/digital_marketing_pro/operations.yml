      - paid_platform_strategy
      - organic_social_strategy
      - influencer_strategy
      - marketplace_strategy
      - crm_strategy
      - content_pr_strategy
      - web_strategy
      - measurement_strategy
    tool_ids:
      - artifact_ledger_tool
      - signal_detection_tool
    stage_ids:
      - stage_09_channel_strategy
    module_ids:
      - aeo_geo_intelligence
      - paid_advertising
      - content_engine
      - influencer_creator
      - marketing_automation
      - cro
      - analytics_insights
  - id: dmp.execution_artifact_generation
    department_id: channel_execution
    label: Execution Artifact Generation
