      - operating_signal_summary
      - product_feedback_brief
      - next_operation_recommendation
    tool_ids:
      - analytics_connector
      - signal_detection_tool
      - report_builder
      - client_report_builder
    stage_ids:
      - stage_12_continuous_improvement
    module_ids:
