version: 1
description: Authoritative production route security matrix for ForgeGraph API and run websocket routes.
scope:
  include:
  - /api/**
  - /api/v1/**
  - /ws/runs/<uuid:run_id>/
  exclude:
  - health
  - ready
  - schema
  - docs
  - redoc
  - test-only routes
defaults:
  jwt:
    unauthenticated: 401
    expired_token: 401
    revoked_token: 401
    rate_limited: 429
  engine_signed:
    missing_signature: 401
    invalid_signature: 401
    stale_timestamp: 401
    exact_replay: 401
  websocket_ticket:
    missing_ticket: disconnect
    wrong_org: disconnect
routes:
- id: accounting
  names:
  - accounting-overview
  paths:
  - /api/accounting
  - /api/v1/accounting
  methods:
  - GET
  auth_surface: jwt
  required_role: viewer
  org_scope: tenant
  expected:
    unauthenticated: 401
    expired_token: 401
    revoked_token: 401
    wrong_org: 403_or_404
    insufficient_role: skip
    correct_role: 2xx_or_domain_error
    malformed_payload: 400_or_domain_error
    rate_limited: 429
    oversized_request: skip
  rate_limit_scope: default
  request_size_limit: api_default
- id: accounting-ledger
  names:
  - accounting-ledger
