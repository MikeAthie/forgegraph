services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    container_name: forgegraph-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      args:
        UV_SYNC_EXTRAS: "--extra kafka"
    environment:
      COMMUNICATION_KAFKA_ENABLED: "true"
      COMMUNICATION_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      COMMUNICATION_KAFKA_TOPIC: ${COMMUNICATION_KAFKA_TOPIC:-forgegraph.communication.events.v1}
    depends_on:
      redpanda:
        condition: service_healthy
