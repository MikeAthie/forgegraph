[project]
name = "forgegraph-backend"
version = "0.1.0"
description = "ForgeGraph Django control plane API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Django & REST Framework
    "django>=6.0.4",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.3.1",
    # WebSockets (Phase 4.6)
    "channels>=4.2.2",
    "channels-redis>=4.3.0",
    "daphne>=4.1.0",
    # API docs
    "drf-spectacular>=0.27.1",
    # Database
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    # Cache
    "redis>=5.0.1",
    # Tasks
    "celery>=5.3.6",
    # Server
    "gunicorn>=21.2.0",
    # Environment
    "python-dotenv>=1.2.2",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "pyyaml>=6.0.3",
    # Auth0 OIDC + SCIM + Stripe
    "requests>=2.33.1",
    "python-jose>=3.3.0",
    "stripe>=8.0.0",
]

[project.optional-dependencies]
kafka = [
    "confluent-kafka>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-testmon>=2.1.3",
    "factory-boy>=3.3.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "django-stubs>=4.2.0",
    "djangorestframework-stubs>=3.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "infrastructure/grpc/engine_pb2.py",
    "infrastructure/grpc/engine_pb2_grpc.py",
    "infrastructure/orm/migrations",
    "testsprite_tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C901", # mccabe complexity
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "adapters", "infrastructure", "config"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = [
    "infrastructure/grpc/engine_pb2\\.py$",
    "infrastructure/grpc/engine_pb2_grpc\\.py$",
    "infrastructure/orm/migrations/.*\\.py$",
    "testsprite_tests/.*\\.py$",
    "manage\\.py$",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "adapters.api.company_ops.serializers",
    "adapters.api.gateway.views",
    "adapters.api.integrations.gateway_views",
    "adapters.api.ops.views",
    "adapters.api.service_engagements.views",
    "application.services.agency_account_catalog",
    "application.services.agency_commercial_funnel",
    "application.services.agency_deliverables",
    "application.services.agency_onboarding",
    "application.services.agency_reporting_cadence",
    "application.services.atlas_conversational_campaigns",
    "application.services.atlas_onboarding",
    "application.services.atlas_prompt_delivery",
    "application.services.codex_media_worker",
    "application.services.codex_session_runtime",
    "application.services.company_run_task_routing",
    "application.services.deliverable_formatting",
    "application.services.department_pipeline",
    "application.services.gateway_inbound",
    "application.services.gateway_media",
    "application.services.gateway_registry",
    "application.services.legacy_weekend_pipeline",
    "application.services.operating_model_packs",
    "application.services.product_operations",
    "application.services.whatsapp_connectors",
    "application.services.whiteboard_boards",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "infrastructure.grpc.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "infrastructure.orm.admin"
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "infrastructure.orm.management.commands.*"
disallow_untyped_defs = false
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
