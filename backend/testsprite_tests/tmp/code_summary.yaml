version: "2"
type: backend
tech_stack:
  - Python 3.12
  - Django 5
  - Django REST Framework
  - Channels
  - PostgreSQL
  - Redis
  - Celery
  - gRPC client
features:
  - name: Authentication and Identity
    description: User registration, login, logout, token refresh, profile lookup, and SSO entry points for the ForgeGraph control plane.
    files:
      - adapters/api/auth/urls.py
      - adapters/api/auth/views.py
      - adapters/api/sso/urls.py
      - adapters/api/sso/views.py
    endpoints:
      - method: POST
        path: /api/auth/register
        description: Register a new user account.
        auth_required: false
        response_schema:
          "200": User and token payload
          "400": Validation error
      - method: POST
        path: /api/auth/login
        description: Authenticate a user and issue tokens.
        auth_required: false
        response_schema:
          "200": Access and refresh token payload
          "401": Authentication failed
      - method: POST
        path: /api/auth/logout
        description: Invalidate the current authenticated session.
        auth_required: true
        response_schema:
          "200": Logout confirmation
      - method: POST
        path: /api/auth/refresh
        description: Refresh an access token.
        auth_required: false
        response_schema:
          "200": Refreshed access token
          "401": Invalid refresh token
      - method: GET
        path: /api/auth/me
        description: Return the current authenticated user.
        auth_required: true
        response_schema:
          "200": User profile
      - method: GET
        path: /api/auth/sso/provider
        description: Return SSO provider configuration.
        auth_required: false
        response_schema:
          "200": SSO provider metadata
    depends_on:
      - Django authentication
      - JWT token handling
      - Organization membership
  - name: Graph Authoring and Validation
    description: CRUD and validation APIs for workflow graphs, versions, templates, and external workflow imports.
    files:
      - adapters/api/graphs/urls.py
      - adapters/api/graphs/views.py
      - domain/services/graph_validator.py
      - application/use_cases/graphs/
    endpoints:
      - method: GET
        path: /api/graphs
        description: List workflow graphs visible to the current tenant or user.
        auth_required: true
        response_schema:
          "200": Graph list
      - method: POST
        path: /api/graphs
        description: Create a new workflow graph.
        auth_required: true
        request_schema:
          body:
            name: string
            nodes: array
            edges: array
        response_schema:
          "200": Graph detail
          "400": Validation error
      - method: POST
        path: /api/graphs/validate
        description: Validate a graph payload before saving or running it.
        auth_required: true
        request_schema:
          body:
            graph: object
        response_schema:
          "200": Validation result
          "400": Invalid graph
      - method: GET
        path: /api/graphs/{graph_id}
        description: Fetch a single graph and its metadata.
        auth_required: true
        response_schema:
          "200": Graph detail
          "404": Graph not found
      - method: POST
        path: /api/graphs/external-workflows
        description: Import or update external workflows idempotently.
        auth_required: true
        response_schema:
          "200": Imported workflow result
          "400": Validation error
    depends_on:
      - Authentication
      - Graph domain models
      - Graph validator
  - name: Run Lifecycle and Engine Coordination
    description: Start, invoke, stream, resume, replay, cancel, and inspect workflow runs while coordinating with the Go engine.
    files:
      - adapters/api/runs/urls.py
      - adapters/api/runs/views.py
      - adapters/gateways/grpc_engine_client.py
      - application/services/run_preparation.py
    endpoints:
      - method: GET
        path: /api/runs
        description: List runs for the current tenant or user.
        auth_required: true
        response_schema:
          "200": Run list
      - method: POST
        path: /api/runs/start
        description: Start a graph run through the engine.
        auth_required: true
        request_schema:
          body:
            graph_id: uuid
            input: object
        response_schema:
          "200": Run accepted response
          "400": Validation error
      - method: POST
        path: /api/runs/invoke
        description: Start a run from an invocation-style payload.
        auth_required: true
        response_schema:
          "200": Run accepted response
      - method: GET
        path: /api/runs/{run_id}
        description: Return run detail and current status.
        auth_required: true
        response_schema:
          "200": Run detail
          "404": Run not found
      - method: GET
        path: /api/runs/{run_id}/events
        description: Return run events captured for a run.
        auth_required: true
        response_schema:
          "200": Run event list
      - method: GET
        path: /api/runs/{run_id}/stream
        description: Stream run events for a run.
        auth_required: true
        response_schema:
          "200": Event stream
      - method: POST
        path: /api/runs/{run_id}/resume
        description: Resume a paused or approval-blocked run.
        auth_required: true
        response_schema:
          "200": Resume accepted
      - method: POST
        path: /api/runs/{run_id}/replay
        description: Replay a completed or failed run from checkpoints.
        auth_required: true
        response_schema:
          "200": Replay accepted
      - method: POST
        path: /api/runs/{run_id}/cancel
        description: Cancel an active run.
        auth_required: true
        response_schema:
          "200": Cancel result
      - method: POST
        path: /api/runs/engine-events
        description: Receive callback events from the engine runtime.
        auth_required: true
        response_schema:
          "200": Callback accepted
          "403": Invalid engine callback secret
    depends_on:
      - Authentication
      - gRPC engine client
      - Run persistence
      - Event streaming
  - name: Memory, Analytics, and Governance APIs
    description: Memory usage, observations, analytics, retention, quotas, policies, approvals, and audit support for tenant governance.
    files:
      - adapters/api/memory/urls.py
      - adapters/api/analytics/urls.py
      - adapters/api/policies/urls.py
      - adapters/api/retention/urls.py
      - adapters/api/approvals/urls.py
      - adapters/api/audit_logs/urls.py
    endpoints:
      - method: GET
        path: /api/memory/usage
        description: Return memory usage metrics.
        auth_required: true
        response_schema:
          "200": Memory usage summary
      - method: GET
        path: /api/memory/observations
        description: List stored memory observations.
        auth_required: true
        response_schema:
          "200": Observation list
      - method: POST
        path: /api/memory/observations
        description: Create a new memory observation.
        auth_required: true
        response_schema:
          "200": Observation detail
          "400": Validation error
      - method: GET
        path: /api/analytics/memory/usage
        description: Return tenant memory analytics.
        auth_required: true
        response_schema:
          "200": Memory analytics
      - method: GET
        path: /api/analytics/llm/usage
        description: Return model usage analytics.
        auth_required: true
        response_schema:
          "200": LLM usage analytics
      - method: GET
        path: /api/approvals
        description: List pending or historical human approval items.
        auth_required: true
        response_schema:
          "200": Approval list
      - method: GET
        path: /api/audit-logs
        description: List tenant audit log entries.
        auth_required: true
        response_schema:
          "200": Audit log list
      - method: GET
        path: /api/policies/guardrails
        description: Return tenant runtime guardrails and policy configuration.
        auth_required: true
        response_schema:
          "200": Policy payload
    depends_on:
      - Authentication
      - Tenant context
      - Database persistence
      - Optional Redis and memory integrations
  - name: Marketplace, Credentials, Billing, and Integrations
    description: Marketplace package APIs, credential storage, billing endpoints, and external integration helpers for tenant operations.
    files:
      - adapters/api/marketplace/urls.py
      - adapters/api/credentials/urls.py
      - adapters/api/billing/urls.py
      - adapters/api/integrations/urls.py
      - adapters/api/organizations/urls.py
    endpoints:
      - method: GET
        path: /api/marketplace/packages
        description: List marketplace packages available to the tenant.
        auth_required: true
        response_schema:
          "200": Marketplace package list
      - method: GET
        path: /api/marketplace/installed
        description: List installed marketplace packages.
        auth_required: true
        response_schema:
          "200": Installed package list
      - method: GET
        path: /api/credentials
        description: List saved credentials.
        auth_required: true
        response_schema:
          "200": Credential list
      - method: POST
        path: /api/credentials/oauth/start
        description: Start an OAuth credential flow.
        auth_required: true
        response_schema:
          "200": OAuth start payload
      - method: GET
        path: /api/billing/plans
        description: Return available billing plans.
        auth_required: true
        response_schema:
          "200": Billing plan list
      - method: POST
        path: /api/integrations/http/test
        description: Execute an HTTP integration test request.
        auth_required: true
        response_schema:
          "200": Integration test result
          "400": Validation error
    depends_on:
      - Authentication
      - Credential encryption
      - Billing provider integration
      - Tenant scoping
known_limitations:
  - issue: Some features depend on external services such as PostgreSQL, Redis, billing providers, OAuth providers, or the Go engine to behave like production.
    location: adapters/api/ and application/services/
    impact: Full end-to-end behavior can differ from isolated local execution unless dependencies are configured.
  - issue: Run behavior spans synchronous APIs, async callbacks, and streaming/event flows.
    location: adapters/api/runs/ and adapters/ws/
    impact: Tests need deterministic fixtures and orchestration to avoid flaky integration coverage.
