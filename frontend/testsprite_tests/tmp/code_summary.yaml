version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 14
  - React 18
  - Radix UI
  - Jest
  - Playwright
routes:
  - path: /
    file: pages/index.tsx
    auth_required: false
    description: Marketing landing page and entry point to login or app flows.
  - path: /login
    file: pages/login.tsx
    auth_required: false
    description: User login page.
  - path: /register
    file: pages/register.tsx
    auth_required: false
    description: User registration page.
  - path: /graphs
    file: pages/graphs.tsx
    auth_required: true
    description: Graph listing and navigation page.
  - path: /graphs/[graphId]
    file: pages/graphs/[graphId].tsx
    auth_required: true
    description: Graph editor page for creating and editing workflow graphs.
  - path: /runs
    file: pages/runs.tsx
    auth_required: true
    description: Run history and monitoring page.
  - path: /runs/[runId]
    file: pages/runs/[runId].tsx
    auth_required: true
    description: Detailed run trace and status page.
  - path: /prompts
    file: pages/prompts.tsx
    auth_required: true
    description: Prompt management page.
  - path: /memory
    file: pages/memory.tsx
    auth_required: true
    description: Memory browser and observation management page.
  - path: /approvals
    file: pages/approvals.tsx
    auth_required: true
    description: Human approval queue page.
  - path: /credentials
    file: pages/credentials.tsx
    auth_required: true
    description: Credential management page.
  - path: /onboarding
    file: pages/onboarding.tsx
    auth_required: true
    description: Onboarding flow and milestone page.
  - path: /analytics/llm
    file: pages/analytics/llm.tsx
    auth_required: true
    description: LLM usage analytics dashboard.
  - path: /analytics/memory
    file: pages/analytics/memory.tsx
    auth_required: true
    description: Memory analytics dashboard.
  - path: /admin
    file: pages/admin/index.tsx
    auth_required: true
    description: Admin landing page.
  - path: /admin/audit-logs
    file: pages/admin/audit-logs.tsx
    auth_required: true
    description: Audit log viewer.
  - path: /admin/billing
    file: pages/admin/billing.tsx
    auth_required: true
    description: Billing and plan management page.
  - path: /admin/help
    file: pages/admin/help.tsx
    auth_required: true
    description: Admin support and help page.
  - path: /admin/marketplace
    file: pages/admin/marketplace.tsx
    auth_required: true
    description: Marketplace administration page.
  - path: /admin/operations
    file: pages/admin/operations.tsx
    auth_required: true
    description: Operational controls and diagnostics page.
  - path: /admin/organization
    file: pages/admin/organization.tsx
    auth_required: true
    description: Organization management page.
  - path: /admin/sso
    file: pages/admin/sso.tsx
    auth_required: true
    description: Single sign-on administration page.
  - path: /oauth/callback
    file: pages/oauth/callback.tsx
    auth_required: false
    description: OAuth callback handling page.
  - path: /sso/callback
    file: pages/sso/callback.tsx
    auth_required: false
    description: SSO callback handling page.
features:
  - name: Authentication and Session Flows
    description: Register, login, protected routing, and callback handling for authenticated app access.
    files:
      - pages/login.tsx
      - pages/register.tsx
      - components/ProtectedRoute.tsx
      - contexts/AuthContext.tsx
      - pages/oauth/callback.tsx
      - pages/sso/callback.tsx
    entry_route: /login
    user_interactions:
      - Fill email and password fields on login or registration forms.
      - Submit credentials and wait for navigation into the authenticated app.
      - Attempt to open a protected page and get redirected when unauthenticated.
      - Return from OAuth or SSO callback routes and complete login flow.
    api_calls:
      - method: POST
        endpoint: /api/auth/login
      - method: POST
        endpoint: /api/auth/register
      - method: GET
        endpoint: /api/auth/me
    auth_required: false
  - name: Graph Authoring Experience
    description: Visual workflow graph editing, node configuration, validation overlays, and wizard-assisted authoring.
    files:
      - pages/graphs.tsx
      - pages/graphs/[graphId].tsx
      - components/graph-editor/GraphEditor.tsx
      - components/graph-editor/NodeConfigDialog.tsx
      - components/graph-editor/NodeInspector.tsx
      - components/graph-editor/validation/ValidationOverlay.tsx
      - components/graph-editor/wizard/AgentWizard.tsx
    entry_route: /graphs
    user_interactions:
      - Open the graph list and navigate into a graph editor.
      - Add nodes, connect edges, and open node configuration forms.
      - Edit graph metadata and node settings.
      - Trigger validation and inspect overlay or status feedback.
      - Use the agent wizard and quick-add tools to scaffold graph content.
    api_calls:
      - method: GET
        endpoint: /api/graphs
      - method: GET
        endpoint: /api/graphs/{graph_id}
      - method: POST
        endpoint: /api/graphs/validate
    auth_required: true
  - name: Run Monitoring and Execution Feedback
    description: Start-facing run pages, run history, trace detail, and event-driven status views.
    files:
      - pages/runs.tsx
      - pages/runs/[runId].tsx
      - components/runs/AgentTracePanel.tsx
      - components/runs/MemoryActivityPanel.tsx
    entry_route: /runs
    user_interactions:
      - Open the run list to inspect previous executions.
      - Navigate to a specific run detail page.
      - Observe run statuses, traces, and memory activity panels.
      - Refresh or revisit run detail after backend status changes.
    api_calls:
      - method: GET
        endpoint: /api/runs
      - method: GET
        endpoint: /api/runs/{run_id}
      - method: GET
        endpoint: /api/runs/{run_id}/events
      - method: GET
        endpoint: /api/runs/{run_id}/stream
    auth_required: true
  - name: Prompt, Credential, Approval, and Memory Management
    description: Operational pages for prompts, credentials, human approvals, and stored memory observations.
    files:
      - pages/prompts.tsx
      - pages/credentials.tsx
      - pages/approvals.tsx
      - pages/memory.tsx
      - components/memory/MemoryObservationList.tsx
      - components/memory/MemoryObservationDetailPanel.tsx
    entry_route: /prompts
    user_interactions:
      - Open prompt, credential, approval, or memory pages from the app navigation.
      - Browse lists, inspect detail panels, and submit relevant forms.
      - Review pending approvals and memory observations.
    api_calls:
      - method: GET
        endpoint: /api/prompts
      - method: GET
        endpoint: /api/credentials
      - method: GET
        endpoint: /api/approvals
      - method: GET
        endpoint: /api/memory/observations
      - method: GET
        endpoint: /api/memory/usage
    auth_required: true
  - name: Analytics, Onboarding, and Admin Surfaces
    description: Dashboards and administration pages for analytics, onboarding progress, billing, organization, SSO, audit logs, operations, and marketplace views.
    files:
      - pages/onboarding.tsx
      - pages/analytics/llm.tsx
      - pages/analytics/memory.tsx
      - pages/admin/index.tsx
      - pages/admin/audit-logs.tsx
      - pages/admin/billing.tsx
      - pages/admin/organization.tsx
      - pages/admin/operations.tsx
      - pages/admin/marketplace.tsx
      - pages/admin/sso.tsx
    entry_route: /onboarding
    user_interactions:
      - Open onboarding and analytics dashboards after login.
      - Navigate through admin sections and inspect organization, billing, SSO, audit, and marketplace pages.
      - Review charts, tables, and status cards driven by backend data.
    api_calls:
      - method: GET
        endpoint: /api/onboarding/milestones
      - method: GET
        endpoint: /api/analytics/llm/usage
      - method: GET
        endpoint: /api/analytics/memory/usage
      - method: GET
        endpoint: /api/audit-logs
      - method: GET
        endpoint: /api/billing/plans
      - method: GET
        endpoint: /api/orgs/me
      - method: GET
        endpoint: /api/marketplace/packages
    auth_required: true
known_limitations:
  - issue: Most meaningful routes depend on authenticated backend APIs and seeded data.
    location: pages/, contexts/AuthContext.tsx, and lib/api.ts
    impact: Frontend-only tests need mocks, while end-to-end tests need backend and engine support to exercise real flows.
  - issue: The graph editor is interaction-heavy and sensitive to API and validation responses.
    location: components/graph-editor/
    impact: High-confidence coverage requires integration or E2E tests in addition to simple component rendering tests.
